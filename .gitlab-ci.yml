test-backend:
  stage: test
  image: python:3.12
  services:
    - name: postgres:16
      alias: postgres
  variables:
    POSTGRES_DB: testdb
    POSTGRES_USER: test
    POSTGRES_PASSWORD: test
    DATABASE_URL: postgresql://test:test@postgres:5432/testdb
  script:
    - pip install -r backend/api/requirements.txt
    - pytest backend/tests
    
