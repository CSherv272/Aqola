version: "3.8"

services:
  # Postgres
  db:
    image: postgis/postgis:16-3.4
    container_name: aqola-postgres
    environment:
      POSTGRES_DB: aqola
      POSTGRES_USER: aqola_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mysecretpassword}
    ports:
      - "5431:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aqola_user -d aqola"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aqola-network

volumes:
  postgres_data:

networks:
  aqola-network:
    driver: bridge
