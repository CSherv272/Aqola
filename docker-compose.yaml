version: "3.8"

services:
  # Postgres
  db:
    image: postgis/postgis:16-3.4
    container_name: aqola-postgres
    environment:
      POSTGRES_DB: aqola
      POSTGRES_USER: aqola_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mysecretpassword}
    ports:
      - "5431:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aqola_user -d aqola"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aqola-network

  # Backend
  backend:
    build:
      context: ./backend/api/
      dockerfile: Dockerfile
    container_name: aqola-backend
    environment:
      DATABASE_URL: postgresql://aqola_user:${POSTGRES_PASSWORD:-mysecretpassword}@db:5432/aqola
      PORT: 8000
    ports:
      - "8000:9001"
    depends_on:
      db:
        condition: service_healthy

    networks:
      - aqola-network

  # Frontend
  frontend:
    build:
      context: ./frontend/aqola-frontend/
      dockerfile: Dockerfile
    container_name: aqola-frontend
    ports:
      - "3000:3000"
    depends_on:
      - db
    networks:
      - aqola-network

volumes:
  postgres_data:

networks:
  aqola-network:
    driver: bridge
